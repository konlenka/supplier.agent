# Fly.io config for the Creme Cafe supplier bot. How to deploy: README -> Deployment.
#
# First deploy must be `fly deploy --ha=false`. Fly's default is two machines for
# redundancy; two machines are two bots, and the supplier gets every order twice.

app = "creme-supplier-bot"    # must be unique across Fly; change it here if the name is taken
primary_region = "syd"        # Sydney: the bot stores staff phone numbers

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 5000
  force_https = true
  # The Wednesday job and the follow-ups run inside the app process. A machine stopped
  # for being idle would sleep through 9:00 on Wednesday, so it is never stopped.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

# Stock counts, order history, orders waiting for approval and the record of this week's
# order. Off this volume, every deploy wipes them and the next run can order again.
[mounts]
  source = "creme_data"
  destination = "/app/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
